[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-linux"
version = "0.1.0"
description = "Safe, capability-detected desktop automation for Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications",
    "Topic :: Desktop Environment",
]
dependencies = [
    "mcp>=2.1",
    "numpy",
    "Pillow",
]

[project.scripts]
cul = "computer_use_linux.cli:main"
cul-mcp = "computer_use_linux.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not disruptive and not requires_consent'"
markers = [
    "requires_session: needs a live desktop session",
    "disruptive: moves or types on the user's desktop",
    "requires_consent: opens a desktop consent dialog",
]

[tool.ruff]
line-length = 220
target-version = "py314"
# reference-probes/ are throwaway scripts kept verbatim as executed evidence
# for docs/ENVIRONMENT.md; they are deliberately terse and are not packaged.
exclude = ["reference-probes"]

[tool.ruff.lint]
select = ["E", "F", "I"]
